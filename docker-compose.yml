version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: deno_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: my_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
